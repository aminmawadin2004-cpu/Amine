name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Backup lib and pubspec
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml

      - name: Create Flutter Android project structure
        run: |
          flutter create . --platforms=android --org com.autodiagpro.app --project-name autodiag_pro_ai

      - name: Restore lib and pubspec
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib lib
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          rm -f pubspec.lock

      - name: Upgrade Kotlin and Gradle versions
        run: |
          # Bump Kotlin version to 1.9.24 to match the stdlib pulled in by dependencies
          if [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
            sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.1.0"/' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .[0-9.]*./ext.kotlin_version = "1.9.24"/' android/build.gradle
          fi
          # Bump Gradle wrapper to a version compatible with AGP 8.x
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          fi
          echo "----- settings.gradle -----"
          cat android/settings.gradle || true
          echo "----- gradle-wrapper.properties -----"
          cat android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
